name: Weekly Price Report

on:
  # 日曜の価格更新完了後（最大2時間後）の08:00 JST
  schedule:
    - cron: '0 23 * * 0'  # 日曜 23:00 UTC = 月曜 08:00 JST
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv Pillow

      - name: Find latest diff date
        id: find-date
        run: |
          # 最新のdiff_logsの日付を取得
          LATEST=$(ls workspace/data/diff_logs/ | grep gpu | sort -r | head -1 | sed 's/-gpu.jsonl//')
          echo "date=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest diff date: $LATEST"

      - name: Generate price report (blog + tweets)
        run: |
          python scripts/generate_price_report.py

      - name: Commit blog article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/blog/
          git diff --cached --quiet || git commit -m "📊 Weekly price report [skip ci]"
          git push

  tweet-report:
    needs: generate-report
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install tweepy Pillow requests

      - name: Find latest blog article
        id: find-blog
        run: |
          LATEST=$(ls -t static/blog/*weekly_report* 2>/dev/null | head -1 | xargs basename)
          echo "filename=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest weekly report: $LATEST"

      - name: Post weekly report tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python scripts/twitter_bot.py --force-blog --blog-filename "${{ steps.find-blog.outputs.filename }}"
