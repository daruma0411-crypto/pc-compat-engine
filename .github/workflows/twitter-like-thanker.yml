name: Twitter Like Thanker

on:
  # schedule:                            # DISABLED 2026-04-07: X account banned
  #   # 1日2回チェック (JST 10:00, 19:00)
  #   - cron: '0 1 * * *'   # 10:00 JST
  #   - cron: '0 10 * * *'  # 19:00 JST
  workflow_dispatch:

jobs:
  thank-likers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install tweepy
      
      - name: Thank users who liked
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/twitter_like_thanker.py
      
      - name: Commit thanked history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/twitter_thanked_users.json
          git diff --cached --quiet || git commit -m "🙏 Update thanked users [skip ci]"
          git push
