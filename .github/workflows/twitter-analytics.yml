name: Twitter Analytics - Daily Fetch

on:
  # schedule:                            # DISABLED 2026-04-07: X account banned
  #   # 毎日 JST 07:00 (UTC 22:00前日)
  #   - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  fetch-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests python-dotenv
      
      - name: Fetch Twitter Analytics
        env:
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: |
          python scripts/fetch_twitter_analytics.py
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workspace/kpi/
          git diff --cached --quiet || git commit -m "🤖 Daily Twitter Analytics [skip ci]"
          git push
